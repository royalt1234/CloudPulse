version: "3.9"

services:
  metrics-svc:
    build:
      context: ./services/metrics-svc
    ports:
      - "8001:8001"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alerts-svc:
    build:
      context: ./services/alerts-svc
    ports:
      - "8002:8002"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cost-svc:
    build:
      context: ./services/cost-svc
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./gcp-creds.json:/etc/gcp/gcp-credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      metrics-svc:
        condition: service_healthy
      alerts-svc:
        condition: service_healthy
      cost-svc:
        condition: service_healthy
    restart: unless-stopped
