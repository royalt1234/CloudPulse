{{- $services := list
  (dict "name" "metrics-svc" "image" .Values.metricsSvc.image "port" .Values.metricsSvc.port "replicas" .Values.metricsSvc.replicas "resources" .Values.metricsSvc.resources)
  (dict "name" "alerts-svc"  "image" .Values.alertsSvc.image  "port" .Values.alertsSvc.port  "replicas" .Values.alertsSvc.replicas  "resources" .Values.alertsSvc.resources)
  (dict "name" "cost-svc"    "image" .Values.costSvc.image    "port" .Values.costSvc.port    "replicas" .Values.costSvc.replicas    "resources" .Values.costSvc.resources)
  (dict "name" "frontend"    "image" .Values.frontend.image   "port" .Values.frontend.port   "replicas" .Values.frontend.replicas   "resources" .Values.frontend.resources)
-}}
{{- range $svc := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $svc.name }}
    {{- include "cloudpulse.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        azure.workload.identity/use: "true"
        {{- include "cloudpulse.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: cloudpulse-sa
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "cloudpulse.image" (dict "ctx" $ "image" $svc.image) }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if eq $svc.name "cost-svc" }}
          env:
            - name: AWS_ROLE_ARN
              value: {{ $.Values.costSvc.awsRoleArn | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/aws/tokens/aws-token"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/gcp/gcp-credentials.json"
          volumeMounts:
            - name: aws-token
              mountPath: "/var/run/secrets/aws/tokens"
              readOnly: true
            - name: gcp-token
              mountPath: "/var/run/secrets/gcp/tokens"
              readOnly: true
            - name: gcp-config
              mountPath: "/etc/gcp"
              readOnly: true
          {{- end }}
      {{- if eq $svc.name "cost-svc" }}
      volumes:
        - name: aws-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: aws-token
                  expirationSeconds: 86400
                  audience: sts.amazonaws.com
        - name: gcp-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: gcp-token
                  expirationSeconds: 86400
                  audience: {{ $.Values.costSvc.gcpProviderName | quote }}
        - name: gcp-config
          configMap:
            name: gcp-workload-id-config
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
